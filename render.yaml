services:
  - type: web
    name: sanjay-kumar-chemistry-lms
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/hk1911369-eng/sanjay-kumar-chemistry-lms
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://sanjay-kumar-chemistry-lms.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://sanjay-kumar-chemistry-lms.onrender.com
