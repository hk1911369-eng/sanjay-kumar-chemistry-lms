services:
  - type: web
    name: sanjay-kumar-chemistry-lms
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/hk1911369-eng/sanjay-kumar-chemistry-lms
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://sanjay-kumar-chemistry-lms.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://sanjay-kumar-chemistry-lms.onrender.com

  # Prepared staging service only. Do not sync this Blueprint until the test
  # Supabase values are entered securely in Render and the user approves creation.
  - type: web
    name: jmt-academy-staging
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/hk1911369-eng/sanjay-kumar-chemistry-lms
    branch: audit/jmt-master-prompt-follow-through
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://jmt-academy-staging.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://jmt-academy-staging.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
