name: Temporary source audit snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.ref == 'build/reproducible-ci-eslint-lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source for audit
        run: tar -czf /tmp/jmt-source.tar.gz --exclude=.git --exclude=node_modules --exclude=.next .
      - uses: actions/upload-artifact@v4
        with:
          name: jmt-source-audit
          path: /tmp/jmt-source.tar.gz
          if-no-files-found: error
