name: Refresh npm lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.ref == 'build/reproducible-ci-eslint-lockfile'
    runs-on: ubuntu-latest
    steps:
      - name: Check out lockfile branch
        uses: actions/checkout@v4
        with:
          ref: build/reproducible-ci-eslint-lockfile
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "Refresh npm lockfile for patched dependencies"
            git push origin HEAD:build/reproducible-ci-eslint-lockfile
          fi
