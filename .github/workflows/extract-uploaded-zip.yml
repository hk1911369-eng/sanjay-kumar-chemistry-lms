name: Extract uploaded LMS ZIP

on:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - "*.ZIP"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project archive safely
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, shutil
          root = pathlib.Path.cwd()
          archives = sorted([p for p in root.iterdir() if p.is_file() and p.suffix.lower() == ".zip"])
          if not archives:
              raise SystemExit("No ZIP archive found in the repository root.")
          archive = archives[-1]
          temp = root / ".lms-zip-extract"
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = pathlib.PurePosixPath(info.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit("Unsafe path found in ZIP; extraction stopped.")
              z.extractall(temp)
          entries = [p for p in temp.iterdir() if p.name != "__MACOSX"]
          source = entries[0] if len(entries) == 1 and entries[0].is_dir() else temp
          for item in source.iterdir():
              if item.name in {".git", ".github", ".lms-zip-extract"} or item.suffix.lower() == ".zip":
                  continue
              target = root / item.name
              if target.is_dir():
                  shutil.rmtree(target)
              elif target.exists():
                  target.unlink()
              if item.is_dir():
                  shutil.copytree(item, target, ignore=shutil.ignore_patterns(".git", "node_modules", ".next"))
              else:
                  shutil.copy2(item, target)
          shutil.rmtree(temp)
          archive.unlink()
          print(f"Extracted {archive.name} into the repository root.")
          PY

      - name: Commit extracted project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
          else
            git commit -m "Extract uploaded LMS project ZIP"
            git push
          fi
